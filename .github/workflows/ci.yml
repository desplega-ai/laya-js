name: ci

# Docs-only changes skip the whole workflow, including the HF-model bun smoke.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run api:check
      - run: bun run pack:check
      - run: bun run lint
      - run: bun run check-vendor
      - run: bun run test
      - run: bun run test:bun-smoke
      - name: Bun smoke on the real multilingual fp32 bundle (createAgent -> predict -> dispose)
        env:
          HF_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          LAYA_SMOKE_CHECKPOINT: multilingual
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Actions secret HF_ACCESS_TOKEN is empty or not available"; exit 1; }
          bun packages/laya/test/bun-smoke.ts
