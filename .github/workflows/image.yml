name: image

# Builds the laya-server image on PRs (never pushes; GHCR publishing is a manual step later),
# checks its size and non-root user, runs the container smoke, and validates the k8s manifests.
on:
  pull_request:
    paths:
      - packages/laya-server/**
      - packages/laya/src/**
      - package.json
      - bun.lock
      - .dockerignore
      - deploy/k8s/**
      - scripts/smoke-image.ts
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: laya-server:ci
  KUSTOMIZE_VERSION: 5.7.1
  KUBECONFORM_VERSION: 0.7.0
  KUBERNETES_VERSION: 1.33.0

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the HF token
        run: test -n "$HF_TOKEN" || { echo "::error::Actions secret HF_ACCESS_TOKEN is empty or not available (fork PRs do not get secrets)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/laya-server/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          # BuildKit secret, mounted only in the Dockerfile's `models` stage.
          secrets: |
            hf_token=${{ secrets.HF_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Size, non-root and container smoke
        run: bun run smoke:image
        env:
          LAYA_SMOKE_IMAGE: ${{ env.IMAGE }}
      - name: Cache-volume smoke (english fetched at startup)
        run: bun run smoke:image
        env:
          LAYA_SMOKE_IMAGE: ${{ env.IMAGE }}
          LAYA_SMOKE_EXTRA: english

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kustomize build | kubeconform -strict
        run: |
          for dir in deploy/k8s/base deploy/k8s/overlays/all-checkpoints deploy/k8s/overlays/pvc; do
            echo "== $dir"
            kustomize build "$dir" | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -
          done
